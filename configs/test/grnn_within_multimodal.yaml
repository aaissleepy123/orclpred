# GRNN Within-Basket Prediction (Overfitting Fix)
base_config: "base/grnn_base.yaml"

# Override for within-basket task
data:
  within_basket: true
  batch_size: 128  # Smaller batch for more stable training

# Regularization fixes for overfitting
training:
  lr: 0.0002          # Reduced learning rate (50% lower)
  weight_decay: 0.001   # Add L2 regularization
  dropout: 0.3         # Increased dropout for RNN
  node_dropout: 0.2    # Increased node dropout
  message_dropout: 0.2 # Increased message dropout
  
  # Early stopping to prevent overfitting
  early_stopping:
    enabled: true
    patience: 10       # Stop sooner if no improvement
    metric: "recall@20"
    min_delta: 0.001

# GRNN-specific overfitting fixes
model:
  grnn:
    sequential_weight: 0.5  # Reduce RNN influence to prevent memorization

data:
  datagroup: "multimodal"
  dataset: "multimodal_data_v0"
