# TGN Next-Basket Prediction (Compact Config)
base_config: "base/tgn_base.yaml"

# Override only what's different from base
data:
  data_path: "/home/datascience/BasketPrediction/data/DataPreparationandTransformation/groceries_data/data/grocerieswithres"
  within_basket: false  # Next-basket prediction
  sliding_window:
    enabled: True
evaluation:
  prediction_analysis:
    enabled: true
    save_history: true
model: 
  embed_size: 256
  layer_sizes: [256, 256, 256]
training:
  lr: 0.00003                        
  epochs: 200                          
  weight_decay: 1e-4
  dropout: 0.2

# All TGN settings inherited from base/tgn_base.yaml
