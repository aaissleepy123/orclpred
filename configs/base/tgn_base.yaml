# TGN Base Configuration  
# Base settings for TGN variants

base_config: "base/mitgnn_base.yaml"

# Model Configuration (TGN extensions)
model:
  variant: "tgn"
  
  # TGN-specific defaults
  tgn:
    temporal_dim: 2
    temporal_encoding: "cosine"
    temporal_normalization: "raw"
    temporal_weight: 1.0

