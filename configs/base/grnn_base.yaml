# GRNN Base Configuration
# Base settings for GRNN variants

base_config: "base/mitgnn_base.yaml"

# Model Configuration (GRNN extensions)
model:
  variant: "grnn"
  
  # GRNN-specific defaults
  grnn:
    rnn_hidden_dim: 64
    rnn_num_layers: 1
    sequence_max_length: 10
    rnn_type: "LSTM"
    sequential_weight: 1.0

data:
  data_path: "data/multimodal_next_different_split/user_holdout_20"



